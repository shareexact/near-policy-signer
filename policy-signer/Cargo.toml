[package]
name = "policy-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
omni-transaction = { version = "0.5", default-features = false, features = ["evm"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
