name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --tests -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: System libraries for cargo-near
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Install cargo-near (pinned)
        run: cargo install cargo-near --version 0.22.0 --locked
      - name: Build wasm
        run: |
          (cd policy-signer && cargo near build non-reproducible-wasm --locked)
          (cd mock-signer && cargo near build non-reproducible-wasm --locked)
          ls -l target/near/*/*.wasm
      - name: Reproducible wasm (NEP-330, in the image pinned in policy-signer/Cargo.toml)
        run: |
          (cd policy-signer && cargo near build reproducible-wasm)
          cd target/near/policy_signer
          sha256sum policy_signer.wasm | tee policy_signer.wasm.sha256
          echo "policy_signer.wasm sha256: $(cut -d' ' -f1 policy_signer.wasm.sha256)" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reproducible wasm
        uses: actions/upload-artifact@v4
        with:
          name: policy-signer-reproducible-wasm
          path: |
            target/near/policy_signer/policy_signer.wasm
            target/near/policy_signer/policy_signer.wasm.sha256

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test vectors match the contract tests
        run: |
          npm run -s vectors > /tmp/vectors.json
          grep -q d6bd87cccf2d404096fb7cdd9c10f99e4a330c4a5a7a9d94930e377196015c62 /tmp/vectors.json
          grep -q 2af050832cd51552e2244b0c10632b31e83b5d5f1bd148d9cfd57172798a8f87 /tmp/vectors.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  owner-pages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        page: [wallet-page, wallet-page-owner-demo, wallet-page-chain-fix]
    defaults:
      run:
        working-directory: ${{ matrix.page }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.page }}/package-lock.json
      - run: npm ci
      - name: Rebuild gives the committed page
        run: |
          npm run build
          git diff --exit-code index.html
      - name: Test (offline, mock wallet, nothing is signed)
        run: npm test
